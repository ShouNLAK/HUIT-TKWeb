<html>
    <head>
        <title>Bài tập tại lớp 2</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        <style>
            body {
                background-color: #f8f9fa;
                font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                display: flex;
                align-items: center;
                justify-content: center;
                min-height: 100vh;
            }

            .testimonial-card {
                background: #ffffff;
                border-radius: 10px;
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
                padding: 2.5rem 2rem;
                max-width: 600px;
                width: 100%;
                text-align: center;
                margin: 15px;
            }

            .img-container {
                position: relative;
                width: 140px;
                height: 140px;
                margin: 0 auto 1.5rem;
            }

            .img-container img {
                width: 100%;
                height: 100%;
                object-fit: cover;
                border-radius: 50%;
                box-shadow: 5px 5px 15px rgba(0, 0, 0, 0.2);
                position: relative;
                z-index: 2;
            }

            .img-container::before {
                content: "";
                position: absolute;
                top: -5px;
                right: -5px;
                width: 100%;
                height: 100%;
                background-color: #55b2fa;
                border-radius: 50%;
                z-index: 1;
            }

            .quote-icon {
                position: absolute;
                top: 0;
                left: 0;
                background: #55b2fa;
                color: white;
                width: 40px;
                height: 40px;
                border-radius: 50%;
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 1.2rem;
                transform: translate(-20%, 20%);
                z-index: 3;
                box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            }

            .author {
                font-size: 1.5rem;
                font-weight: bold;
                color: #333;
                margin-bottom: 0.25rem;
                letter-spacing: 1px;
            }

            .job {
                font-size: 0.9rem;
                text-transform: uppercase;
                color: #55b2fa;
                margin-bottom: 1rem;
                font-weight: 600;
            }

            .info {
                color: #6c757d;
                font-size: 1.1rem;
                line-height: 1.6;
                margin-bottom: 1.5rem;
            }

            .btn-container {
                display: flex;
                justify-content: center;
                gap: 1.5rem;
                margin-bottom: 1.5rem;
            }

            .nav-btn {
                background: transparent;
                border: none;
                font-size: 1.5rem;
                color: #9cb1ce;
                cursor: pointer;
                transition: color 0.3s ease;
            }

            .nav-btn:hover {
                color: #55b2fa;
            }

            .random-btn {
                background: #e6f3ff;
                color: #55b2fa;
                border: 1px solid #55b2fa;
                border-radius: 5px;
                padding: 0.4rem 1.2rem;
                font-weight: bold;
                cursor: pointer;
                transition: all 0.3s ease;
            }

            .random-btn:hover {
                background: #55b2fa;
                color: #fff;
            }

            .title-section h2 {
                font-weight: bold;
                color: #333;
                margin-bottom: 2rem;
                text-align: center;
            }
        </style>
    </head>
    <body>
       
        <div>
            <div class="title-section">
                <h2>Các Đánh Giá</h2>
            </div>
            <article class="testimonial-card">
                <div class="img-container">
                    <div class="quote-icon">
                        <i class="bi bi-quote" style="font-size: 2em;">"</i>
                    </div>
                    <img id="person-img" src="" alt="Avatar">
                </div>
                <h4 class="author" id="author">Tên người đánh giá</h4>
                <p class="job" id="job">Nghề nghiệp</p>
                <p class="info" id="info">Nội dung đánh giá sẽ hiện ở đây...</p>
                <div class="btn-container">
                    <button class="nav-btn" id="prev-btn">
                        <i class="bi bi-chevron-left"></i>
                    </button>
                    <button class="nav-btn" id="next-btn">
                        <i class="bi bi-chevron-right"></i>
                    </button>
                </div>

                <button class="random-btn" id="random-btn">Ngẫu nhiên</button>
            </article>
        </div>
        <script src="BTTL2.js"></script>
    </body>
</html>
