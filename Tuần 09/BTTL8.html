<html>
<head>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body>
    <div class="carousel-indicators">
        <button type="button" data-bs-target="#demo" data-bs-slide-to="0" class="active"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="1"></button>
        <button type="button" data-bs-target="#demo" data-bs-slide-to="2"></button>
    </div>
    <div id="demo" class="carousel slide" data-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="img/Y.jpg" alt="Rome" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Rome</h3>
                    <p>Rome is in Italy</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/Nga.jpg" alt="Moscow" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Moscow</h3>
                    <p>Moscow is in Russia</p>
                </div>
            </div>
            <div class="carousel-item">
                <img src="img/AiCap.jpg" alt="Cairo" class="d-block w-100">
                <div class="carousel-caption">
                    <h3>Cairo</h3>
                    <p>Cairo is in Egypt</p>
                </div>
            </div>
        </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#demo" data-bs-slide="prev">
        <span class="carousel-control-prev-icon"></span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#demo" data-bs-slide="next">
        <span class="carousel-control-next-icon"></span>
    </button>
</body>
