<html>
<head>
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css"/>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>
    <div class="text-center text-primary">
        <h2>Carousel</h2>
    </div>

    <div id="carouselExampleControls" class="carousel w-50 mx-auto" data-bs-ride="carousel">
        <div class="carousel-inner">
            <div class="carousel-item active">
                <img class="d-block w-100" src="img/Y.jpg" alt="Ảnh 1">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="img/Nga.jpg" alt="Ảnh 2">
            </div>
            <div class="carousel-item">
                <img class="d-block w-100" src="img/AiCap.jpg" alt="Ảnh 3">
            </div>
        </div>
        <a class="carousel-control-prev" data-bs-target="#carouselExampleControls" role="button" data-bs-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" data-bs-target="#carouselExampleControls" role="button" data-bs-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>
</body>
