<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset='utf-8' />
        
        <title>Tuần 06 - BTM1</title>
        <style>
            div{ 
                width:200px; 
                padding:20px; 
                text-align:center; 
                font-weight:bold; 
                font-size:25px; 
                background-color:#909; 
                color:#FFF; 
                border-radius:10px; 
                margin:100px 0px; 
                position:relative; 
                animation: ani 5s linear 1s infinite alternate;  
            }
            @keyframes ani { 
            0% { 
            background-color:#909;left:0px; 
            } 
            25% { 
            background-color:#C3F;left:20%; 
            } 
            50% { 
            background-color:#F9F;left:40%;  
            transform:rotate(180deg) 
            } 
            75% { 
            background-color:#F6F;left:60%; 
            } 
            100% { 
            background-color:#F0F;left:85%; 
            } 
        }
        </style>
    </head>
    <body>
        <div> CSS Animation </div>
    </body>
</html>
