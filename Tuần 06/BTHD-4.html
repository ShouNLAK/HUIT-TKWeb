<head> 
    <title>CSS Position Example</title> 
    <style> 
        .box { 
            width: 100px; 
            height: 100px; 
            background-color: lightcoral; 
            margin: 10px; 
            text-align: center; 
            line-height: 100px; 
        } 
        .relative { 
            position: relative; 
            top: 20px; 
            left: 30px; 
        } 
        .absolute { 
            position: absolute; 
            top: 50px; 
            left: 150px; 
        }  
        .fixed { 
            position: fixed; 
            bottom: 20px; 
            right: 20px; 
        } 
        .sticky { 
            position: sticky; 
            top: 0; 
            background-color: lightgreen; 
        } 
        .container { 
            position: relative; 
            height: 300px; 
            border: 2px solid black; 
            margin-top: 50px; 
        } 
    </style> 
</head> 
<body> 
    <div class="box">Static</div> 
    <div class="box relative">Relative</div> 
    <div class="container"> 
        <div class="box absolute">Absolute</div> 
    </div> 
    <div class="box fixed">Fixed</div> 
    <div style="height: 1000px;"> 
        <div class="box sticky">Sticky</div> 
    </div> 
</body>
