<html>
    <head>
        <title>Bài tập trên lớp #7</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    </head>
    <body>
        <div class="container mt-3">
            <textarea id="input" class="form-control" rows="2" placeholder="Nhập công việc mới"></textarea>
            <button class="btn btn-primary mt-2" onclick="addTask()">Thêm công việc</button>
        </div>
        
        
        <script>
            var tasks = [];
            let saveTasks = localStorage.getItem("Tasks");
            if (saveTasks != null && saveTasks !== "") {
                const parsed = JSON.parse(saveTasks);
                let taskList = document.getElementById("taskList");
                if (!taskList) {
                    taskList = document.createElement("ul");
                    taskList.id = "taskList";
                    document.body.appendChild(taskList);
                }
                for (let i = 0; i < parsed.length; i++) {
                    const task = parsed[i];
                    tasks.push(task);

                    const listItem = document.createElement("li");
                    listItem.textContent = task;

                    const rewriteBtn = document.createElement("button");
                    rewriteBtn.textContent = "Sửa";
                    rewriteBtn.className = "btn btn-secondary btn-sm ms-2";
                    listItem.appendChild(rewriteBtn);

                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "Xóa";
                    deleteBtn.className = "btn btn-danger btn-sm ms-4";
                    listItem.appendChild(deleteBtn);

                    rewriteBtn.addEventListener("click", rewriteTask);
                    deleteBtn.addEventListener("click", deleteTask);

                    taskList.appendChild(listItem);
                }
            }
            function addTask() {
                const taskList = document.getElementById("taskList");
                const input = document.getElementById("input");
                const task = input.value.trim();
                tasks.push(task);
                if (task) {
                    if (!taskList) {
                        const newList = document.createElement("ul");
                        newList.id = "taskList";
                        document.body.appendChild(newList);
                    }
                    const listItem = document.createElement("li");
                    listItem.textContent = task;
                    
                    const rewriteBtn = document.createElement("button");
                    rewriteBtn.textContent = "Sửa";
                    rewriteBtn.className = "btn btn-secondary btn-sm ms-2";
                    listItem.appendChild(rewriteBtn);

                    const deleteBtn = document.createElement("button");
                    deleteBtn.textContent = "Xóa";
                    deleteBtn.className = "btn btn-danger btn-sm ms-4";
                    listItem.appendChild(deleteBtn);

                    rewriteBtn.addEventListener("click", rewriteTask);
                    deleteBtn.addEventListener("click", deleteTask);

                    document.getElementById("taskList").appendChild(listItem);
                    input.value = "";
                }
                localStorage.setItem("Tasks",JSON.stringify(tasks));
            }

            function deleteTask(event) {
                const listItem = event.target.parentElement;
                listItem.remove();
                localStorage.removeItem("Tasks");
                const index = tasks.indexOf(listItem.firstChild.textContent);
                if (index !== -1) {
                    tasks.splice(index, 1);
                    localStorage.setItem("Tasks", JSON.stringify(tasks));
                }
            }

            function rewriteTask(event) {
                const listItem = event.target.parentElement;
                const currentTask = listItem.firstChild.textContent;
                const newTask = prompt("Sửa công việc:", currentTask);
                if (newTask !== null) {
                    listItem.firstChild.textContent = newTask.trim();
                    localStorage.removeItem("Tasks");
                    const index = tasks.indexOf(currentTask);
                    if (index !== -1) {
                        tasks.splice(index, 1);
                        tasks.push(newTask.trim());
                        localStorage.setItem("Tasks", JSON.stringify(tasks));
                    }
                }
            }
        </script>
    </body> 
</html>
