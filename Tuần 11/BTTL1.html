<html>
    <head>
        <title>Bài tập tại lớp #1</title>
    </head>
    <body>
        <p>
            <script>
                let a = parseFloat(prompt("Nhập vào số a:"));
                let b = parseFloat(prompt("Nhập vào số b:"));
                document.write("Tổng của " + a  + " + " + b + " = " + (a + b) );
            </script>
        </p>
    </body>
</html>
