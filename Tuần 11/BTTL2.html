<html>
    <head>
        <title>Bài tập tại lớp #2</title>
    </head>
    <body>
        <p>
            <script>
                let a = [12,25,13,50];
                let max = a[0];
                for (let i = 1; i < 5; i++)
                    if(a[i] > max)
                        max = a[i];
                    document.write("Số lớn nhất trong mảng a là " + max)
            </script>
        </p>
    </body>
</html>
