<html>
    <head>
        <style>
            .grid-container{
                display: grid;
                border: 5px solid black;
                grid-template-columns: repeat(4,200px);
                grid-template-rows: repeat(3,200px);
                width: 830px;
                gap: 10px;
            }
            img{
                width: 100%;
                height: 100%;
            }
            .item1{
                grid-column: 1 / span 2;
                grid-row: 1 / span 2;
                position: relative;
            }
            .item{
                grid-column: span 1;
                grid-row: 1;
                position: relative;
            }
            .item2{
                grid-column: span 1;
                grid-row: 3;
                position: relative;
            }
            .sale{
            position: absolute;
            bottom: 0px;
            left: 0px;
            background-color: #f39c12;
            color: #fff;
            padding: 4px 6px;
            font-size: 20px;
            border-radius: 3px;
            }
        </style>
    </head>

        <div class="grid-container">
