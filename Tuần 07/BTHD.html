<!DOCTYPE html>
<html lang="vi">
    <head>
        <meta charset="utf-8" />
        <title>Tuần 7 - CSS Links</title>
        <style> 
            a:link { 
                color: blue; 
                text-decoration: none; 
            } 
            a:visited { 
                color: purple; 
            } 
            a:hover { 
                color: red; 
                text-decoration: underline;
            } 
            a:active { 
                color: green; 
            } 
        </style> 
    </head>
    <body>
        <h2>Styling a link with color and text-decoration property</h2>
        <p><b><a href="https://www.gifcen.com/wp-content/uploads/2022/11/rickroll-gif-9.gif" target="_blank">This is a link</a></b></p>
    </body>
</html>
