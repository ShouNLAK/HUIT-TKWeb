<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8" />
    <title>Tuần 07 - BTVN1</title>
    <style>
        body {
            margin: 0;
            text-align: center;
            background: #efefef;
            font-family: "Times New Roman", serif;
        }

        .board {
            margin: 40px auto;
            width: 320px;
            height: 320px;
            border: 2px solid #cbcbcb;
            display: grid;
            grid-template-columns: auto auto auto auto;
            grid-template-rows: auto auto auto auto;
        }

        .cell {
            width: 80px;
            height: 80px;
        }

        .black {
            background: #000000;
        }

        .white {
            background: #ffffff;
        }
    </style>
</head>
<body>
    <div class="board">
        <div class="cell black"></div>
        <div class="cell white"></div>
        <div class="cell black"></div>
        <div class="cell white"></div>

        <div class="cell white"></div>
        <div class="cell black"></div>
        <div class="cell white"></div>
        <div class="cell black"></div>

        <div class="cell black"></div>
        <div class="cell white"></div>
        <div class="cell black"></div>
        <div class="cell white"></div>

        <div class="cell white"></div>
        <div class="cell black"></div>
        <div class="cell white"></div>
        <div class="cell black"></div>
    </div>
</body>
</html>
