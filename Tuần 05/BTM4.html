<html>
    <head>
        <style>
            .DinhDang
            {
                width: 500px;
                margin: 0 auto;
                font-size:  30px;
                text-align: center;
                border: 1px solid gray;
                border-radius: 5px;
                transition: 5s;
            }
            .DinhDang:hover
            {
                box-shadow: 0 0 5px #0000FF;
                scale: 1.2;
                translate: 50px 100px;
                rotate: 720deg;
                transform: skew(10px,100px);
            }
        </style>
    </head>
    <body>
        <div class="DinhDang">
            Hover over me!
        </div>
    </body>
</html>
