<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Tuần 3 - Media trong HTML</title>
</head>
<body>
    <h1>Ví dụ sử dụng thẻ media theo bài giảng tuần 3</h1>

    <section>
        <h2>Audio</h2>
        <audio controls>
            <source src="samsung.mp3" type="audio/mp3" />
        </audio>
    </section>

    <section>
        <h2>Video</h2>
        <video controls height="400" width="400">
            <source src="Bird.mp4" type="video/mp4" />
        </video>
    </section>
</body>
</html>
