<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTTL5 - Icon</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        .icon-row i {
            font-size: 1.5rem;
            margin-right: 12px;
        }
    </style>
</head>
<body class="p-4">
    <h2 class="text-primary mb-4">BTTL5 - Thuc hanh Icon</h2>

    <div class="card mb-3">
        <div class="card-header">Font Awesome - icon co ban</div>
        <div class="card-body icon-row">
            <i class="fa-solid fa-bandage"></i>
            <i class="fa-solid fa-cat"></i>
            <i class="fa-solid fa-dragon"></i>
            <i class="fa-regular fa-clock"></i>
            <i class="fa-solid fa-cloud"></i>
            <i class="fa-solid fa-heart text-danger"></i>
            <i class="fa-solid fa-car"></i>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-header">YouTube icon voi kich thuoc khac nhau</div>
        <div class="card-body icon-row">
            <i class="fa-brands fa-youtube text-danger" style="font-size: 0.8rem;"></i>
            <i class="fa-brands fa-youtube text-primary" style="font-size: 1rem;"></i>
            <i class="fa-brands fa-youtube text-warning" style="font-size: 1.25rem;"></i>
            <i class="fa-brands fa-youtube text-danger" style="font-size: 1.5rem;"></i>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-header">Danh gia sao</div>
        <div class="card-body icon-row text-warning">
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star"></i>
            <i class="fa-solid fa-star-half-stroke"></i>
        </div>
    </div>

    <div class="card">
        <div class="card-header">Bootstrap Icons</div>
        <div class="card-body icon-row">
            <i class="bi bi-cloud"></i>
            <i class="bi bi-x-lg"></i>
            <i class="bi bi-person"></i>
            <i class="bi bi-envelope"></i>
            <i class="bi bi-hand-thumbs-up"></i>
        </div>
    </div>
</body>
</html>
