<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BTM1 - Dropdown</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
</head>
<body class="p-4">
    <h2 class="text-primary mb-4">Bai tap mau 1 - Dropdown</h2>

    <div class="mb-4">
        <h5>Dropdown co ban</h5>
        <div class="dropdown">
            <button class="btn btn-secondary dropdown-toggle" type="button" id="dropdownMenuButton1" data-bs-toggle="dropdown" aria-expanded="false">
                Chon mon hoc
            </button>
            <ul class="dropdown-menu" aria-labelledby="dropdownMenuButton1">
                <li><a class="dropdown-item" href="#">Toan</a></li>
                <li><a class="dropdown-item" href="#">Van</a></li>
                <li><a class="dropdown-item" href="#">Anh Van</a></li>
            </ul>
        </div>
    </div>

    <div>
        <h5>Dropdown ngang (dropend)</h5>
        <div class="btn-group dropend">
            <button type="button" class="btn btn-secondary dropdown-toggle" data-bs-toggle="dropdown" aria-expanded="false">
                Danh sach truong
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">THPT.Tran Phu</a></li>
                <li><a class="dropdown-item" href="#">THPT.Tan Binh</a></li>
                <li><a class="dropdown-item active" href="#">THPT.Tay Thanh</a></li>
                <li><a class="dropdown-item" href="#">THPT.Le Trong Tan</a></li>
                <li><a class="dropdown-item disabled" href="#">THPT.Binh Hung Hoa</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
